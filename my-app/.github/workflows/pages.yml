
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/my-app/package-lock.json

      - name: Install dependencies
        working-directory: my-app/my-app
        run: npm ci

      - name: Build static site
        working-directory: my-app/my-app
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://propstoxx-next-639395118020.asia-south1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: my-app/my-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
